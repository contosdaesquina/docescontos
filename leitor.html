<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Leitura | Doces Contos</title>
    
    <!-- Fontes e Estilos (mesmos do index.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="reader-body">

    <!-- Cabeçalho idêntico ao index.html, com o botão de tema -->
    <header class="cabecalho">
        <div class="cabecalho-brand">
            <a href="index.html" class="cabecalho-logo-link">
                <img class="cabecalho-logo" src="dist/logo.svg" alt="Doces Contos Logo">
            </a>
            <p class="cabecalho-titulo">Doces Contos</p>
        </div>

        <div class="header-actions">
            <button id="theme-toggle" class="btn-theme" title="Alternar tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Área principal do conteúdo do capítulo -->
    <main class="reader-container" style="max-width: 720px; margin: 40px auto; padding: 0 20px;">
        <header class="editorial-header">
    <!-- 1. Linha de metadados superior -->
    <div class="editorial-kicker">
        <span class="kicker-line"></span>
        <span id="meta-serie">Carregando...</span>
        <span class="kicker-dot">&bull;</span>
        <span id="meta-cap">Cap. 1</span>
        <span class="kicker-dot">&bull;</span>
        <span id="meta-data" class="kicker-date">--</span>
    </div>

    <!-- 2. Título do Capítulo -->
    <h1 id="chapter-title" class="editorial-title">Carregando título...</h1>

    <!-- 3. Subtítulo / Descrição em itálico -->
    <p id="chapter-subtitle" class="editorial-subtitle"></p>

    <!-- 4. Barra de Autoria e Tempo de Leitura -->
    <div class="editorial-meta-bar">
        <div class="author-box">
            <div class="author-avatar">D</div>
            <div class="author-details">
                <strong class="author-name">Doces Contos</strong>
                <span class="author-handle">@doces.contosbr</span>
            </div>
        </div>

        <div class="reading-metrics">
            <div class="metric-item">
                <strong id="word-count">0</strong>
                <span>PALAVRAS</span>
            </div>
            <div class="metric-item">
                <strong id="read-time">0</strong>
                <span>MINUTOS</span>
            </div>
        </div>
    </div>
</header>

<!-- Corpo do texto do capítulo -->
<div id="chapter-text" class="text-body"></div>

        <!-- Navegação numérica entre capítulos -->
        <div class="chapter-pagination">
            <button id="prev-btn" class="btn btn-primary" onclick="mudarCapitulo(-1)" style="display:none;">&larr; Capítulo Anterior</button>
            <button id="next-btn" class="btn btn-primary" onclick="mudarCapitulo(1)" style="display:none; margin-left: auto;">Próximo Capítulo &rarr;</button>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="rodape" style="margin-top: 80px;">
        <p class="direitos">&copy; Doces Contos. Todos os direitos reservados.</p>
    </footer>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://wlghtkzunixojfldupwk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsZ2h0a3p1bml4b2pmbGR1cHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNzkzMTAsImV4cCI6MjEwMDc1NTMxMH0.BSIvzjfeLfgvSQs2-v4cBxIYsuD45QjJnJXGn1aPAp8';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const params = new URLSearchParams(window.location.search);
        const historiaSlug = params.get('historia');
        const capNumero = parseInt(params.get('cap')) || 1;
        let capituloAtualId = null;

        document.addEventListener('DOMContentLoaded', () => {
            // Tema escuro/claro
            const themeBtn = document.getElementById('theme-toggle');
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme) {
                document.documentElement.setAttribute('data-theme', storedTheme);
                if (themeBtn) themeBtn.querySelector('i').className = storedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    themeBtn.querySelector('i').className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                });
            }

            if (historiaSlug) {
                carregarCapitulo(historiaSlug, capNumero);
            } else {
                document.getElementById('chapter-title').innerText = "História não selecionada";
                document.getElementById('chapter-text').innerHTML = `<p>Volte ao <a href="index.html">catálogo inicial</a> para escolher um conto.</p>`;
            }
        });

        async function carregarCapitulo(slug, num) {
            const { data, error } = await db
                .from('capitulos')
                .select('*')
                .eq('slug_historia', slug)
                .eq('numero_capitulo', num)
                .single();

            if (error || !data) {
                console.error("Erro ao carregar capítulo:", error);
                document.getElementById('chapter-title').innerText = "Capítulo não encontrado";
                document.getElementById('chapter-text').innerHTML = `<p>Não foi possível carregar este capítulo. <a href="sumario.html?historia=${slug}">Voltar ao sumário</a>.</p>`;
                return;
            }

            capituloAtualId = data.id;

            // 1. Preenche o kicker superior
            const nomeSerie = slug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            const metaSerie = document.getElementById('meta-serie');
            const metaCap = document.getElementById('meta-cap');
            const metaData = document.getElementById('meta-data');

            if (metaSerie) metaSerie.innerText = nomeSerie;
            if (metaCap) metaCap.innerText = `Cap. ${data.numero_capitulo}`;

            if (metaData && data.created_at) {
                const dataObj = new Date(data.created_at);
                metaData.innerText = dataObj.toLocaleDateString('pt-BR', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric'
                }).toUpperCase();
            }

            // 2. Título e Subtítulo
            document.title = `${data.titulo_capitulo.replace(/<[^>]*>/g, '')} | Doces Contos`;
            document.getElementById('chapter-title').innerHTML = data.titulo_capitulo;

            const subtitleEl = document.getElementById('chapter-subtitle');
            if (subtitleEl) {
                if (data.descricao) {
                    subtitleEl.innerText = data.descricao;
                    subtitleEl.style.display = 'block';
                } else {
                    subtitleEl.style.display = 'none';
                }
            }

            // 3. Conteúdo do conto
            const chapterTextEl = document.getElementById('chapter-text');
            chapterTextEl.innerHTML = data.conteudo || '<p>Conteúdo em breve.</p>';

            // 4. Contagem de palavras e minutos
            const textoPuro = chapterTextEl.innerText || chapterTextEl.textContent || '';
            const totalPalavras = textoPuro.trim().split(/\s+/).filter(Boolean).length;
            const minutosLeitura = Math.max(1, Math.ceil(totalPalavras / 200));

            const wordCountEl = document.getElementById('word-count');
            const readTimeEl = document.getElementById('read-time');
            if (wordCountEl) wordCountEl.innerText = totalPalavras;
            if (readTimeEl) readTimeEl.innerText = minutosLeitura;

            // 5. Atualiza contadores de likes/deslikes se existirem na página
            const likesEl = document.getElementById('likes-count');
            const deslikesEl = document.getElementById('deslikes-count');
            if (likesEl) likesEl.innerText = data.likes || 0;
            if (deslikesEl) deslikesEl.innerText = data.deslikes || 0;

            // 6. Configura link de voltar ao sumário
            const btnSumario = document.getElementById('btn-sumario');
            if (btnSumario) btnSumario.href = `sumario.html?historia=${slug}`;
        }
    </script>
</body>
</html>
