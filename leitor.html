<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Leitura | Doces Contos</title>
    
    <!-- Fontes e Estilos (mesmos do index.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="reader-body">

    <!-- Cabeçalho idêntico ao index.html, com o botão de tema -->
    <header class="cabecalho">
        <div class="cabecalho-brand">
            <a href="index.html" class="cabecalho-logo-link">
                <img class="cabecalho-logo" src="dist/logo.svg" alt="Doces Contos Logo">
            </a>
            <p class="cabecalho-titulo">Doces Contos</p>
        </div>

        <div class="header-actions">
            <button id="theme-toggle" class="btn-theme" title="Alternar tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Área principal do conteúdo do capítulo -->
    <main class="reader-container" style="max-width: 720px; margin: 40px auto; padding: 0 20px;">
        <header class="editorial-header">
    <!-- 1. Linha de metadados superior -->
    <div class="editorial-kicker">
        <span class="kicker-line"></span>
        <span id="meta-serie">Carregando...</span>
        <span class="kicker-dot">&bull;</span>
        <span id="meta-cap">Cap. 1</span>
        <span class="kicker-dot">&bull;</span>
        <span id="meta-data" class="kicker-date">--</span>
    </div>

    <!-- 2. Título do Capítulo -->
    <h1 id="chapter-title" class="editorial-title">Carregando título...</h1>

    <!-- 3. Subtítulo / Descrição em itálico -->
    <p id="chapter-subtitle" class="editorial-subtitle"></p>

    <!-- 4. Barra de Autoria e Tempo de Leitura -->
    <div class="editorial-meta-bar">
        <div class="author-box">
            <div class="author-avatar">D</div>
            <div class="author-details">
                <strong class="author-name">Doces Contos</strong>
                <span class="author-handle">@doces.contosbr</span>
            </div>
        </div>

        <div class="reading-metrics">
            <div class="metric-item">
                <strong id="word-count">0</strong>
                <span>PALAVRAS</span>
            </div>
            <div class="metric-item">
                <strong id="read-time">0</strong>
                <span>MINUTOS</span>
            </div>
        </div>
    </div>
</header>

<!-- Corpo do texto do capítulo -->
<div id="chapter-text" class="text-body"></div>

        <!-- Navegação numérica entre capítulos -->
        <div class="chapter-pagination">
            <button id="prev-btn" class="btn btn-primary" onclick="mudarCapitulo(-1)" style="display:none;">&larr; Capítulo Anterior</button>
            <button id="next-btn" class="btn btn-primary" onclick="mudarCapitulo(1)" style="display:none; margin-left: auto;">Próximo Capítulo &rarr;</button>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="rodape" style="margin-top: 80px;">
        <p class="direitos">&copy; Doces Contos. Todos os direitos reservados.</p>
    </footer>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
    // Configuração unificada do Supabase
    const SUPABASE_URL = 'https://wlghtkzunixojfldupwk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsZ2h0a3p1bml4b2pmbGR1cHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNzkzMTAsImV4cCI6MjEwMDc1NTMxMH0.BSIvzjfeLfgvSQs2-v4cBxIYsuD45QjJnJXGn1aPAp8';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // VARIÁVEis GLOBAIS (para ficarem acessíveis a qualquer função)
    const params = new URLSearchParams(window.location.search);
    const historiaSlug = params.get('historia');
    let capAtual = parseInt(params.get('cap')) || 1;

    document.addEventListener('DOMContentLoaded', () => {
        // ==========================================
        // 1. ALTERNÂNCIA DE TEMA (LIGHT / DARK)
        // ==========================================
        const themeBtn = document.getElementById('theme-toggle');
        const storedTheme = localStorage.getItem('theme');
        
        if (storedTheme) {
            document.documentElement.setAttribute('data-theme', storedTheme);
            atualizarIconeTema(storedTheme);
        }

        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                atualizarIconeTema(newTheme);
            });
        }

        function atualizarIconeTema(theme) {
            if (!themeBtn) return;
            const icon = themeBtn.querySelector('i');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        // ==========================================
        // 2. CARREGAMENTO DO CAPÍTULO DO SUPABASE
        // ==========================================
        if (historiaSlug) {
            carregarCapitulo(historiaSlug, capAtual);
        } else {
            document.getElementById('chapter-title').innerText = "Nenhuma história selecionada";
            document.getElementById('chapter-text').innerHTML = "<p>Por favor, retorne à página inicial e escolha uma história.</p>";
        }
    });

    async function carregarCapitulo(slug, numero) {
        try {
            const { data, error } = await db
                .from('capitulos')
                .select('*')
                .eq('slug_historia', slug)
                .eq('numero_capitulo', numero)
                .maybeSingle();

            if (error || !data) {
                document.getElementById('story-category').innerText = "Aviso";
                document.getElementById('chapter-title').innerText = "Capítulo não encontrado";
                document.getElementById('chapter-text').innerHTML = "<p>Ops! Este capítulo ainda não foi publicado ou o link está incorreto.</p>";
                return;
            }

            document.getElementById('page-title').innerText = `${data.titulo_capitulo} | Doces Contos`;
            document.getElementById('story-category').innerText = slug.replace(/-/g, ' ');
            document.getElementById('chapter-title').innerText = `Capítulo ${data.numero_capitulo}: ${data.titulo_capitulo}`;
            document.getElementById('chapter-text').innerHTML = data.conteudo;

            // Puxa os votos atuais do Supabase
            carregarVotos(slug, numero);
            verificarNavegacao(slug, numero);

        } catch (err) {
            console.error("Erro ao carregar o capítulo:", err);
        }
    }

    async function carregarVotos(slug, numero) {
        const { data, error } = await db
            .from('capitulos')
            .select('likes, deslikes')
            .eq('slug_historia', slug)
            .eq('numero_capitulo', numero)
            .maybeSingle();

        if (!error && data) {
            document.getElementById('like-count').innerText = data.likes || 0;
            document.getElementById('dislike-count').innerText = data.deslikes || 0;
        }
    }

    async function verificarNavegacao(slug, numero) {
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        if (numero > 1) {
            prevBtn.style.display = 'inline-block';
        } else {
            prevBtn.style.display = 'none';
        }

        const { data } = await db
            .from('capitulos')
            .select('numero_capitulo')
            .eq('slug_historia', slug)
            .eq('numero_capitulo', numero + 1)
            .maybeSingle();

        if (data) {
            nextBtn.style.display = 'inline-block';
        } else {
            nextBtn.style.display = 'none';
        }
    }

    function mudarCapitulo(direcao) {
        capAtual += direcao;
        window.location.href = `leitor.html?historia=${historiaSlug}&cap=${capAtual}`;
    }

    // ==========================================
    // 3. FUNÇÃO DE VOTAÇÃO (CURTIR / DESLIKE)
    // ==========================================
    async function votarCapitulo(tipo) {
        const sessaoKey = `voto_${historiaSlug}_${capAtual}`;
        if (localStorage.getItem(sessaoKey)) {
            alert('Você já votou neste capítulo nesta sessão!');
            return;
        }

        const likeCountElem = document.getElementById('like-count');
        const dislikeCountElem = document.getElementById('dislike-count');
        const likeIcon = document.getElementById('like-icon');
        const dislikeIcon = document.getElementById('dislike-icon');

        let novoLikes = parseInt(likeCountElem.innerText) || 0;
        let novosDislikes = parseInt(dislikeCountElem.innerText) || 0;

        if (tipo === 'like') {
            novoLikes++;
            likeCountElem.innerText = novoLikes;
            likeIcon.className = "fas fa-heart";
            likeIcon.style.color = "var(--primary-color)";
        } else {
            novosDislikes++;
            dislikeCountElem.innerText = novosDislikes;
            dislikeIcon.className = "fas fa-thumbs-down";
            dislikeIcon.style.color = "var(--accent-red, #ef4444)";
        }

        // Salva no localStorage para impedir voto duplicado
        localStorage.setItem(sessaoKey, tipo);

        // Atualiza no banco de dados do Supabase
        const { error } = await db
            .from('capitulos')
            .update({ likes: novoLikes, deslikes: novosDislikes })
            .eq('slug_historia', historiaSlug)
            .eq('numero_capitulo', capAtual);

        if (error) {
            console.error("Erro ao registrar voto no Supabase:", error);
            alert("Erro ao salvar o voto. Verifique se a política de UPDATE foi criada no Supabase.");
        }
    }
</script>
</body>
</html>
